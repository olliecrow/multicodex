name: Security policy checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install tmux for integration tests (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
          tmux -V

      - name: Install tmux for integration tests (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list tmux >/dev/null 2>&1 || brew install tmux
          tmux -V

      - name: Run Go tests
        run: go test ./...

      - name: Run race-enabled Go tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build multicodex
        run: go build -trimpath -o "$RUNNER_TEMP/multicodex" ./cmd/multicodex

  security-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.0"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -sSfL -o "${archive}" "${base_url}/${archive}"
          curl -sSfL -o checksums.txt "${base_url}/gitleaks_${version}_checksums.txt"
          grep "${archive}" checksums.txt | sha256sum -c -
          tar -xzf "${archive}"
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the commit range with gitleaks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "${PUSH_BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            range="${GITHUB_SHA}^!"
          else
            range="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
          fi
          gitleaks git --redact --verbose --config .gitleaks.toml --log-opts="${range}"

      - name: Self-test sensitive text policy patterns
        run: |
          set -euo pipefail
          tmp_ok="$(mktemp)"
          tmp_bad="$(mktemp)"
          tmp_bad_json="$(mktemp)"
          tmp_bad_email="$(mktemp)"
          printf 'docs: keep /Users/YOU, user@example.com, and user@invalid.example as placeholders only\n' > "${tmp_ok}"
          printf 'fix: %s=%s\n' "token" "abc123456789XYZ" > "${tmp_bad}"
          printf '{"tokens":{"%s":"%s","%s":"%s"}}\n' \
            "access_token" "abcdefghijklmnopqrstuvwxyz123456" \
            "refresh_token" "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456" > "${tmp_bad_json}"
          {
            printf '%s@%s\n' "private.user" "gmail.com"
            printf '%s@%s\n' "user" "example.com.evil.com"
            printf '"%s"@%s\n' "user" "gmail.com"
            printf '%s@%s\n' "user" "example.xn--p1ai"
          } > "${tmp_bad_email}"
          bash scripts/security/check-sensitive-text.sh --context=policy-selftest "${tmp_ok}"
          if bash scripts/security/check-sensitive-text.sh --context=policy-selftest "${tmp_bad}"; then
            echo "policy self-test unexpectedly passed" >&2
            exit 1
          fi
          if bash scripts/security/check-sensitive-text.sh --context=policy-selftest "${tmp_bad_json}"; then
            echo "JSON policy self-test unexpectedly passed" >&2
            exit 1
          fi
          if bash scripts/security/check-sensitive-text.sh --context=policy-selftest "${tmp_bad_email}"; then
            echo "email policy self-test unexpectedly passed" >&2
            exit 1
          fi

      - name: Self-test sensitive text policy without ripgrep
        run: |
          set -euo pipefail
          tmp_bad="$(mktemp)"
          tmp_bad_json="$(mktemp)"
          tmp_bad_email="$(mktemp)"
          printf 'fix: %s=%s\n' "token" "abc123456789XYZ" > "${tmp_bad}"
          printf '{"tokens":{"%s":"%s"}}\n' "access_token" "abcdefghijklmnopqrstuvwxyz123456" > "${tmp_bad_json}"
          {
            printf '%s@%s\n' "private.user" "gmail.com"
            printf '%s@%s\n' "user" "example.com.evil.com"
            printf '"%s"@%s\n' "user" "gmail.com"
            printf '%s@%s\n' "user" "example.xn--p1ai"
          } > "${tmp_bad_email}"
          if PATH="/usr/bin:/bin" bash scripts/security/check-sensitive-text.sh --context=policy-fallback-selftest "${tmp_bad}"; then
            echo "fallback policy self-test unexpectedly passed" >&2
            exit 1
          fi
          if PATH="/usr/bin:/bin" bash scripts/security/check-sensitive-text.sh --context=policy-fallback-selftest "${tmp_bad_json}"; then
            echo "fallback JSON policy self-test unexpectedly passed" >&2
            exit 1
          fi
          if PATH="/usr/bin:/bin" bash scripts/security/check-sensitive-text.sh --context=policy-fallback-selftest "${tmp_bad_email}"; then
            echo "fallback email policy self-test unexpectedly passed" >&2
            exit 1
          fi

      - name: Check commit messages for policy violations
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "${PUSH_BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            range="${GITHUB_SHA}^!"
          else
            range="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
          fi

          temp_file="$(mktemp)"
          git log --format='%H%n%s%n%b%n' "${range}" > "${temp_file}"
          bash scripts/security/check-sensitive-text.sh --context=commit-message "${temp_file}"

      - name: Check the patch for policy violations
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "${PUSH_BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            range="${GITHUB_SHA}^!"
          else
            range="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
          fi

          temp_file="$(mktemp)"
          git show --format= --patch --no-color "${range}" > "${temp_file}"
          bash scripts/security/check-sensitive-text.sh --context=patch "${temp_file}"

      - name: Check the pull request title and body for policy violations
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          temp_file="$(mktemp)"
          printf '%s\n\n%s\n' "${PR_TITLE}" "${PR_BODY}" > "${temp_file}"
          bash scripts/security/check-sensitive-text.sh --context=pr-metadata "${temp_file}"
