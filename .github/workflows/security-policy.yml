name: Security policy checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly scan so an unchanged main still meets new advisories.
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tmux for integration tests (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
          tmux -V

      - name: Install tmux for integration tests (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list tmux >/dev/null 2>&1 || brew install tmux
          tmux -V

      - name: Check Go formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "gofmt needed for:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Run race-enabled Go tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build multicodex
        run: go build -trimpath -o "$RUNNER_TEMP/multicodex" ./cmd/multicodex

  security-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          # Reviewed digest of the official release asset; update it with the version.
          expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL -o "${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${expected_sha256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}"
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the commit range with gitleaks
        if: github.event_name != 'schedule'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range="$(bash scripts/security/ci-range.sh)"
          for config in .gitleaks.toml .gitleaks-paths.toml; do
            gitleaks git --redact --config "$config" --log-opts="--text --no-textconv --no-ext-diff ${range}"
          done

      - name: Test scanner regressions
        run: bash scripts/security/test-policy.sh

      - name: Self-test sensitive text policy patterns
        run: |
          set -euo pipefail
          tmp_ok="$(mktemp)"
          tmp_bad="$(mktemp)"
          tmp_bad_json="$(mktemp)"
          tmp_bad_email="$(mktemp)"
          printf 'docs: keep /Users/YOU, user@example.com, and user@invalid.example as placeholders only\n' > "${tmp_ok}"
          printf 'fix: %s=%s\n' "token" "abc123456789XYZ" > "${tmp_bad}"
          printf '{"tokens":{"%s":"%s","%s":"%s"}}\n' \
            "access_token" "abcdefghijklmnopqrstuvwxyz123456" \
            "refresh_token" "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456" > "${tmp_bad_json}"
          {
            printf '%s@%s\n' "private.user" "gmail.com"
            printf '%s@%s\n' "user" "example.com.evil.com"
            printf '"%s"@%s\n' "user" "gmail.com"
            printf '%s@%s\n' "user" "example.xn--p1ai"
          } > "${tmp_bad_email}"
          bash scripts/security/check-sensitive-text.sh --context=policy-selftest "${tmp_ok}"
          if bash scripts/security/check-sensitive-text.sh --context=policy-selftest "${tmp_bad}"; then
            echo "policy self-test unexpectedly passed" >&2
            exit 1
          fi
          if bash scripts/security/check-sensitive-text.sh --context=policy-selftest "${tmp_bad_json}"; then
            echo "JSON policy self-test unexpectedly passed" >&2
            exit 1
          fi
          if bash scripts/security/check-sensitive-text.sh --context=policy-selftest "${tmp_bad_email}"; then
            echo "email policy self-test unexpectedly passed" >&2
            exit 1
          fi

      - name: Self-test sensitive text policy without ripgrep
        run: |
          set -euo pipefail
          tmp_bad="$(mktemp)"
          tmp_bad_json="$(mktemp)"
          tmp_bad_email="$(mktemp)"
          printf 'fix: %s=%s\n' "token" "abc123456789XYZ" > "${tmp_bad}"
          printf '{"tokens":{"%s":"%s"}}\n' "access_token" "abcdefghijklmnopqrstuvwxyz123456" > "${tmp_bad_json}"
          {
            printf '%s@%s\n' "private.user" "gmail.com"
            printf '%s@%s\n' "user" "example.com.evil.com"
            printf '"%s"@%s\n' "user" "gmail.com"
            printf '%s@%s\n' "user" "example.xn--p1ai"
          } > "${tmp_bad_email}"
          if PATH="/usr/bin:/bin" bash scripts/security/check-sensitive-text.sh --context=policy-fallback-selftest "${tmp_bad}"; then
            echo "fallback policy self-test unexpectedly passed" >&2
            exit 1
          fi
          if PATH="/usr/bin:/bin" bash scripts/security/check-sensitive-text.sh --context=policy-fallback-selftest "${tmp_bad_json}"; then
            echo "fallback JSON policy self-test unexpectedly passed" >&2
            exit 1
          fi
          if PATH="/usr/bin:/bin" bash scripts/security/check-sensitive-text.sh --context=policy-fallback-selftest "${tmp_bad_email}"; then
            echo "fallback email policy self-test unexpectedly passed" >&2
            exit 1
          fi

      - name: Self-test commit checks
        run: |
          set -euo pipefail
          checks="${PWD}/scripts/security"
          repo="$(mktemp -d)"
          git init -q -b main "${repo}"
          commit() {
            git -C "${repo}" -c user.name=Test -c user.email="$1" -c commit.gpgsign=false commit -q --allow-empty -m "$2"
            git -C "${repo}" rev-parse HEAD
          }
          good="$(commit 1+test@users.noreply.github.com good)"
          bad="$(commit "$(printf '%s@%s' private.user gmail.com)" bad)"
          (cd "${repo}" && bash "${checks}/check-commits.sh" selftest "${good}")
          if (cd "${repo}" && bash "${checks}/check-commits.sh" selftest "${bad}"); then
            echo "identity self-test unexpectedly passed" >&2
            exit 1
          fi
          if ! (cd "${repo}" && PRE_COMMIT_FROM_REF="$(printf '0%.0s' {1..39})1" PRE_COMMIT_TO_REF="${good}" bash "${checks}/check-push-range.sh"); then
            echo "unknown base rejected a clean commit" >&2
            exit 1
          fi
          if (cd "${repo}" && PRE_COMMIT_FROM_REF="$(printf '0%.0s' {1..39})1" PRE_COMMIT_TO_REF="${bad}" bash "${checks}/check-push-range.sh"); then
            echo "unknown base accepted a disallowed commit" >&2
            exit 1
          fi
          if bash "${checks}/check-sensitive-text.sh" --context=selftest "${repo}/missing.txt"; then
            echo "missing input self-test unexpectedly passed" >&2
            exit 1
          fi

      - name: Check outgoing commits for policy violations
        if: github.event_name != 'schedule'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range="$(bash scripts/security/ci-range.sh)"
          revisions="$(git rev-list "$range")"
          if [[ -z "${revisions}" ]]; then
            echo "no new commits to check"
            exit 0
          fi
          # shellcheck disable=SC2086 # one commit id per word
          bash scripts/security/check-commits.sh ci ${revisions}

      - name: Check the pull request title and body for policy violations
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          temp_file="$(mktemp)"
          printf '%s\n\n%s\n' "${PR_TITLE}" "${PR_BODY}" > "${temp_file}"
          bash scripts/security/check-sensitive-text.sh --context=pr-metadata "${temp_file}"
