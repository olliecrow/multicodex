title = "multicodex secret policy"

[extend]
useDefault = true

# The default rules miss Anthropic OAuth tokens (sk-ant-oat01-).
[[rules]]
id = "anthropic-token"
description = "Anthropic API, admin, or OAuth token"
regex = '''(?:^|[^A-Za-z0-9_-])sk-ant-[a-z]+[0-9]{2}-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-"]
tags = ["key", "anthropic"]
